name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install project dependencies
        run: |
          npm ci || true

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps

      - name: Start simple static server
        run: |
          python -m http.server 5600 &

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:5600
        run: |
          npx playwright test --reporter=github

      # Optional: run emulator-backed tests if emulator is configured in the repo
      # - name: Start Firebase emulator
      #   run: npx firebase emulators:start --only firestore &
      # - name: Run emulator-backed Node tests
