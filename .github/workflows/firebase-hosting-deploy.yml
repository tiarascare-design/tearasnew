name: Deploy to Firebase Hosting

# Trigger on pushes to `main` and allow manual runs
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          # Create this secret in the repository settings (Settings → Secrets and variables → Actions)
          # Generate a token locally with: `firebase login:ci` and paste it as FIREBASE_TOKEN.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Use the project id from .firebaserc; override with --project if you want a specific project
          firebase deploy --only hosting --project tiaras-website
